name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Validate sample project
        run: npm run validate
      - name: Audit sample project
        run: npm run audit
      - name: Export HTML proof
        run: npm run export
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      DESIGNFORGE_BROWSER: ${{ matrix.engine }}
      DESIGNFORGE_BROWSER_CHANNEL: ${{ matrix.engine == 'chromium' && 'chrome' || '' }}
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: 45000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Install CJK glyph coverage for visual evidence
        run: |
          sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fonts-unifont
          fc-list :lang=zh
      - name: Verify runner Chrome installation
        if: matrix.engine == 'chromium'
        run: google-chrome --version
      - name: Install the exact Firefox or WebKit build required by Playwright
        if: matrix.engine != 'chromium'
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Record the actual launched engine and version
        run: node tools/browser-version.mjs > browser-version.json
      - name: Capture initial pixel baselines for explicit review
        run: npm run test:browser -- --update-snapshots
      - name: Preserve real browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.engine }}
          path: |
            test-results/
            playwright-report/
            browser-version.json
            tests/browser/*-snapshots/
          retention-days: 14
