name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Validate sample project
        run: npm run validate
      - name: Audit sample project
        run: npm run audit
      - name: Export HTML proof
        run: npm run export
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Preserve real browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
